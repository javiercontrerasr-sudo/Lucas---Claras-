name: Verificar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controles de seguridad
        run: python scripts/verify.py

  publicar:
    # Solo se publica desde main y solo si los controles pasaron
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar solo los archivos del sitio
        run: |
          mkdir _site
          cp -r index.html assets descargas SHA256SUMS robots.txt .nojekyll _site/
          mkdir -p _site/.well-known && cp .well-known/security.txt _site/.well-known/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
